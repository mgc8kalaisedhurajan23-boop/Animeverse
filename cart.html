<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnimeVerse Cart</title>

<link rel="stylesheet" href="cart.css">

<script src="https://kit.fontawesome.com/f3fcaba754.js" crossorigin="anonymous"></script>

</head>

<body>

<div class="cart">

<table>

<tr>

<th>Items</th>
<th>Price</th>
<th>Quantity</th>
<th>Total</th>
<th>Remove</th>

</tr>

<tr>

<td>

<div class="cart-info">

<img src="images/luffy.jpg">

<div>

<h3>Luffy Action Figure </h3>

<p>Premium Figure</p>

</div>

</div>

</td>

<td>₹2999</td>

<td>

<div class="quantity">

<button>-</button>

<input type="text" value="1">

<button>+</button>

</div>

</td>

<td>₹2999</td>

<td>

<i class="fa-solid fa-xmark remove"></i>

</td>

</tr>

<tr>

<td>

<div class="cart-info">

<img src="images/zoro.jpg">

<div>

<h3>Roronoa Zoro</h3>

<p>King of Hell</p>

</div>

</div>

</td>

<td>₹3499</td>

<td>

<div class="quantity">

<button>-</button>

<input type="text" value="1">

<button>+</button>

</div>

</td>

<td>₹3499</td>

<td>

<i class="fa-solid fa-xmark remove"></i>

</td>

</tr>

<tr class="grand">

<td colspan="3">
Grand Total
</td>

<td>
₹6498
</td>

<td>

<button class="checkout">

Proceed

</button>

</td>

</tr>

</table>

</div>

</body>
</html>
